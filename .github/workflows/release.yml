name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.0'
      - name: Validate
        run: |
          node scripts/validate-repository.mjs
          node --test plugins/lark-agent-bridge/tests/*.test.mjs
      - name: Verify tag matches manifest
        run: |
          expected="v$(node -p "require('./plugins/lark-agent-bridge/.codex-plugin/plugin.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Package plugin
        run: |
          mkdir -p release
          tar -czf "release/lark-agent-bridge-${GITHUB_REF_NAME}.tar.gz" -C plugins lark-agent-bridge
          cd plugins
          zip -qr "../release/lark-agent-bridge-${GITHUB_REF_NAME}.zip" lark-agent-bridge
          cd ../release
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
