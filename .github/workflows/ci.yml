name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.12.0'
      - name: Validate repository structure
        run: |
          node scripts/validate-repository.mjs
          node scripts/validate-unified-plugin.mjs
          node scripts/validate-gijiroku-plugin.mjs
      - name: Test Bridge manager
        run: >-
          node --test
          plugins/lark-agent-bridge/tests/bridge-manager.test.mjs
          plugins/sfl-lark-ai-suite/tests/bridge-manager.test.mjs
          plugins/sfl-lark-ai-suite/tests/gijiroku-config.test.mjs
          plugins/sfl-lark-ai-suite/tests/gijiroku-document.test.mjs
          plugins/sfl-gijiroku/tests/gijiroku-config.test.mjs
          plugins/sfl-gijiroku/tests/gijiroku-document.test.mjs
      - name: Check for common secret patterns
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' 'cli_[A-Za-z0-9]{16,}' . || \
             grep -RInE --exclude-dir=.git --exclude='*.md' '(app[_-]?secret|access[_-]?token)[[:space:]]*[:=]' .; then
            echo 'Potential secret detected.' >&2
            exit 1
          fi

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: ['20.12.0', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: >-
          node --test
          plugins/lark-agent-bridge/tests/bridge-manager.test.mjs
          plugins/sfl-lark-ai-suite/tests/bridge-manager.test.mjs
          plugins/sfl-lark-ai-suite/tests/gijiroku-config.test.mjs
          plugins/sfl-lark-ai-suite/tests/gijiroku-document.test.mjs
          plugins/sfl-gijiroku/tests/gijiroku-config.test.mjs
          plugins/sfl-gijiroku/tests/gijiroku-document.test.mjs
      - name: Check Unix bootstrap
        if: runner.os != 'Windows'
        run: |
          bash -n plugins/lark-agent-bridge/scripts/bootstrap.sh
          bash plugins/lark-agent-bridge/scripts/bootstrap.sh --check-only
          bash plugins/lark-agent-bridge/scripts/bootstrap.sh --runtime-only
          bash -n plugins/lark-agent-bridge/scripts/terminal-setup.sh
          bash plugins/lark-agent-bridge/scripts/terminal-setup.sh --runtime-check-only
          bash -n plugins/lark-agent-bridge/scripts/terminal-diagnose.sh
          bash plugins/lark-agent-bridge/scripts/terminal-diagnose.sh
          bash -n plugins/sfl-lark-ai-suite/scripts/bootstrap.sh
          bash plugins/sfl-lark-ai-suite/scripts/bootstrap.sh --check-only
          bash -n plugins/sfl-lark-ai-suite/scripts/terminal-diagnose.sh
          bash plugins/sfl-lark-ai-suite/scripts/terminal-diagnose.sh
      - name: Check Windows bootstrap
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File plugins/lark-agent-bridge/scripts/bootstrap-windows.ps1 -CheckOnly
          powershell -NoProfile -ExecutionPolicy Bypass -File plugins/lark-agent-bridge/scripts/bootstrap-windows.ps1 -RuntimeOnly
          powershell -NoProfile -ExecutionPolicy Bypass -File plugins/lark-agent-bridge/scripts/terminal-setup.ps1 -RuntimeCheckOnly
          powershell -NoProfile -ExecutionPolicy Bypass -File plugins/lark-agent-bridge/scripts/terminal-diagnose.ps1 -SyntaxCheckOnly
          powershell -NoProfile -ExecutionPolicy Bypass -File plugins/sfl-lark-ai-suite/scripts/bootstrap-windows.ps1 -CheckOnly
          powershell -NoProfile -ExecutionPolicy Bypass -File plugins/sfl-lark-ai-suite/scripts/terminal-diagnose.ps1 -SyntaxCheckOnly
