name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.12.0'
      - name: Validate repository structure
        run: |
          node scripts/validate-repository.mjs
          node scripts/validate-unified-plugin.mjs
      - name: Test Bridge manager
        run: node --test plugins/lark-agent-bridge/tests/bridge-manager.test.mjs plugins/sfl-lark-ai-suite/tests/*.test.mjs
      - name: Check for common secret patterns
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' 'cli_[A-Za-z0-9]{16,}' . || \
             grep -RInE --exclude-dir=.git --exclude='*.md' '(app[_-]?secret|access[_-]?token)[[:space:]]*[:=]' .; then
            echo 'Potential secret detected.' >&2
            exit 1
          fi

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: ['20.12.0', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test plugins/lark-agent-bridge/tests/bridge-manager.test.mjs plugins/sfl-lark-ai-suite/tests/*.test.mjs
